name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Execute analysis notebook on synthetic data
        env:
          USE_SYNTHETIC: "1"
        run: |
          jupyter nbconvert --to notebook --execute \
            analysis/recovery_vs_volume.ipynb \
            --output /tmp/recovery_vs_volume_synthetic.ipynb \
            --ExecutePreprocessor.timeout=600
